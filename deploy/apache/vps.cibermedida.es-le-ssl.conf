<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName vps.cibermedida.es

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:8766/
    ProxyPassReverse / http://127.0.0.1:8766/

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/vps.cibermedida.es/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/vps.cibermedida.es/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ErrorLog ${APACHE_LOG_DIR}/vps.cibermedida.es-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/vps.cibermedida.es-ssl-access.log combined
</VirtualHost>
</IfModule>
