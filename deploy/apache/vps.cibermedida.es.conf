<VirtualHost *:80>
    ServerName vps.cibermedida.es
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass / http://127.0.0.1:8766/
    ProxyPassReverse / http://127.0.0.1:8766/

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L,NE]

    ErrorLog ${APACHE_LOG_DIR}/vps.cibermedida.es-error.log
    CustomLog ${APACHE_LOG_DIR}/vps.cibermedida.es-access.log combined
</VirtualHost>
